kind = "web"
previewPath = "/"
title = "CityOne Growth Frontend"
version = "1.0.0"
id = "artifacts/cityone-growth-frontend"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23097

[services.development]
run = "pnpm --filter @workspace/cityone-growth-frontend run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cityone-growth-frontend", "run", "build" ]
publicDir = "artifacts/cityone-growth-frontend/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23097"
BASE_PATH = "/"
