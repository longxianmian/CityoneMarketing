<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>CityOne</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: #f6ffed;
      }
      .boot-shell {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f6ffed;
      }
      .boot-card {
        width: 100%;
        max-width: 360px;
        text-align: center;
        background: #fff;
        border-radius: 20px;
        box-shadow: 0 12px 32px rgba(17, 94, 89, 0.08);
        padding: 28px 24px;
      }
      .boot-spinner {
        width: 34px;
        height: 34px;
        margin: 0 auto;
        border-radius: 50%;
        border: 3px solid rgba(44, 219, 206, 0.18);
        border-top-color: #2cdbce;
        animation: boot-spin 0.8s linear infinite;
      }
      .boot-title {
        margin-top: 18px;
        font-size: 18px;
        font-weight: 700;
        color: #172b24;
      }
      .boot-desc {
        margin-top: 10px;
        color: #666;
        line-height: 1.8;
        font-size: 14px;
      }
      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script>
      (function () {
        var pathname = window.location.pathname || ''
        var titleEl = document.querySelector('.boot-title')
        var descEl = document.querySelector('.boot-desc')
        if (!titleEl || !descEl) return

        if (pathname !== '/welfare') {
          titleEl.textContent = '页面加载中'
          descEl.textContent = '系统正在准备页面内容。'
          return
        }

        var params = new URLSearchParams(window.location.search || '')
        var directIntent = (params.get('intent') || '').trim()
        if (directIntent) {
          titleEl.textContent = '正在继续领取'
          descEl.textContent = '系统正在确认 LINE 身份并自动完成后续步骤。'
          history.replaceState(null, '', '/welfare/continue?intent=' + encodeURIComponent(directIntent))
          return
        }

        var rawState = (params.get('liff.state') || '').trim()
        if (!rawState) {
          titleEl.textContent = '正在加载福利中心'
          descEl.textContent = '系统正在准备活动、卡券和权益内容。'
          return
        }

        var decoded = decodeURIComponent(rawState)
        if (decoded.indexOf(window.location.origin) === 0) {
          decoded = decoded.slice(window.location.origin.length)
        }
        if (decoded.charAt(0) !== '/') decoded = '/' + decoded
        if (decoded.indexOf('/welfare/') === 0) decoded = decoded.slice('/welfare'.length)
        decoded = decoded.replace(/^\/+/, '/')
        if (
          decoded.indexOf('/continue?') === 0 ||
          decoded.indexOf('/open-in-line?') === 0 ||
          decoded.indexOf('/follow-confirm?') === 0
        ) {
          titleEl.textContent = '正在继续领取'
          descEl.textContent = '系统正在确认 LINE 身份并自动完成后续步骤。'
          history.replaceState(null, '', '/welfare' + decoded)
          return
        }

        titleEl.textContent = '正在加载福利中心'
        descEl.textContent = '系统正在准备活动、卡券和权益内容。'
      })()
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot-shell">
        <div class="boot-card">
          <div class="boot-spinner"></div>
          <div class="boot-title">正在继续领取</div>
          <div class="boot-desc">系统正在确认 LINE 身份并自动完成后续步骤。</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
