<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>CityOne</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: #f6ffed;
      }
      .boot-shell {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f6ffed;
      }
      .boot-card {
        width: 100%;
        max-width: 360px;
        text-align: center;
        background: #fff;
        border-radius: 20px;
        box-shadow: 0 12px 32px rgba(17, 94, 89, 0.08);
        padding: 28px 24px;
      }
      .boot-spinner {
        width: 34px;
        height: 34px;
        margin: 0 auto;
        border-radius: 50%;
        border: 3px solid rgba(44, 219, 206, 0.18);
        border-top-color: #2cdbce;
        animation: boot-spin 0.8s linear infinite;
      }
      .boot-title {
        margin-top: 18px;
        font-size: 18px;
        font-weight: 700;
        color: #172b24;
      }
      .boot-desc {
        margin-top: 10px;
        color: #666;
        line-height: 1.8;
        font-size: 14px;
      }
      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script>
      (function () {
        var pathname = window.location.pathname || ''
        var ua = navigator.userAgent || ''
        var inExternalShell = !/Line\/\d/i.test(ua)
        var boot = {
          title: '页面加载中',
          desc: '系统正在准备页面内容。'
        }

        if (pathname !== '/welfare') {
          window.__CITYONE_BOOT__ = boot
          return
        }

        var params = new URLSearchParams(window.location.search || '')
        var directIntent = (params.get('intent') || '').trim()
        var resumeIntent = (params.get('resume_intent') || '').trim()
        if (directIntent) {
          boot.title = '正在继续领取'
          boot.desc = '系统正在确认 LINE 身份并自动完成后续步骤。'
          window.__CITYONE_BOOT__ = boot
          return
        }
        if (resumeIntent) {
          boot.title = '正在进入 LINE 继续'
          boot.desc = '系统正在恢复当前操作，并准备在 LINE 内继续后续步骤。'
          window.__CITYONE_BOOT__ = boot
          return
        }

        var rawState = (params.get('liff.state') || '').trim()
        if (!rawState) {
          boot.title = '正在加载福利中心'
          boot.desc = '系统正在准备活动、卡券和权益内容。'
          window.__CITYONE_BOOT__ = boot
          return
        }

        var decoded = decodeURIComponent(rawState)
        if (decoded.indexOf(window.location.origin) === 0) {
          decoded = decoded.slice(window.location.origin.length)
        }
        if (decoded.charAt(0) !== '/') decoded = '/' + decoded
        decoded = decoded.replace(/^\/+/, '/')
        if (decoded.indexOf('/welfare/continue?') === 0) {
          if (inExternalShell) {
            boot.title = '请在 LINE 中继续'
            boot.desc = '系统正在准备 LINE 打开入口，请稍候。'
          } else {
            boot.title = '正在继续领取'
            boot.desc = '系统正在确认 LINE 身份并自动完成后续步骤。'
          }
          window.__CITYONE_BOOT__ = boot
          return
        }

        boot.title = '正在加载福利中心'
        boot.desc = '系统正在准备活动、卡券和权益内容。'
        window.__CITYONE_BOOT__ = boot
      })()
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot-shell">
        <div class="boot-card">
          <div class="boot-spinner"></div>
          <div class="boot-title">页面加载中</div>
          <div class="boot-desc">系统正在准备页面内容。</div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var boot = window.__CITYONE_BOOT__ || {}
        var titleEl = document.querySelector('.boot-title')
        var descEl = document.querySelector('.boot-desc')
        if (titleEl && boot.title) titleEl.textContent = boot.title
        if (descEl && boot.desc) descEl.textContent = boot.desc
      })()
    </script>
    <script type="module">
      // 入口分流：仅 LIFF 续接路径走轻量 callback-entry（无 admin 路由 / 不挂载 App）
      // 其它一律走 main 完整入口，避免路由表分裂导致页面跳转失效
      const pathname = window.location.pathname || ''
      const params = new URLSearchParams(window.location.search || '')
      const isCallbackEntry =
        ((pathname === '/' || pathname === '/welfare') && (params.has('intent') || params.has('liff.state') || params.has('resume_intent'))) ||
        pathname === '/welfare/open-in-line' ||
        pathname === '/welfare/continue' ||
        pathname === '/welfare/follow-confirm'
      const root = document.getElementById('root')

      const entryLoader = isCallbackEntry
        ? import('/src/callback-entry.tsx').then((m) => ({ mount: m.mount }))
        : import('/src/main.tsx').then(() => ({ mount: () => {} }))

      entryLoader
        .then((mod) => {
          if (!root) throw new Error('root element missing')
          mod.mount(root)
        })
        .catch((error) => {
          console.error('[boot] failed to load entry module', error)
          const titleEl = document.querySelector('.boot-title')
          const descEl = document.querySelector('.boot-desc')
          if (titleEl) titleEl.textContent = '页面加载异常'
          if (descEl) descEl.textContent = '请刷新重试，或联系客服。'
        })
    </script>
  </body>
</html>
